name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      id-token: write
      contents: write
      attestations: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
            node-version: 24
            registry-url: https://registry.npmjs.org/
            cache: pnpm
            
      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - if: steps.changesets.outputs.published == 'true'
        name: Verify published package
        run: |
          version=$(node -p "require('./package.json').version")
          registry_version=$(npm view "@pungfe/element@$version" version)
          test "$registry_version" = "$version"

          if git ls-remote --exit-code origin "refs/tags/@pungfe/element@$version" >/dev/null; then
            echo "Verified tag @pungfe/element@$version"
          else
            echo "::warning::Package $version is published, but its remote Git tag was not found"
          fi
        